services:
  web:
    container_name: agrocyms
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Agrocyms}
        NEXT_PUBLIC_APP_TAGLINE: ${NEXT_PUBLIC_APP_TAGLINE:-One Platform. Every Farm. Smarter Agriculture.}
        NEXT_PUBLIC_APP_TITLE: ${NEXT_PUBLIC_APP_TITLE:-Farm Management Software for Modern Agriculture | Agrocyms}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION:-Manage your farming operations with Agrocyms. Bring crop and livestock activities, farm resources, and business management together in one platform.}
        NEXT_PUBLIC_LOGO_PATH: ${NEXT_PUBLIC_LOGO_PATH:-/agrocyms-logo.png}
        NEXT_PUBLIC_TWITTER_HANDLE: ${NEXT_PUBLIC_TWITTER_HANDLE:-@agrocyms}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://agrocyms.com}
        NEXT_PUBLIC_SITE_LOCALE: ${NEXT_PUBLIC_SITE_LOCALE:-en}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_REQUEST_TIMEOUT_MS: ${NEXT_PUBLIC_REQUEST_TIMEOUT_MS:-30000}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}
        API_PROXY_TARGET: ${DOCKER_API_PROXY_TARGET:-http://host.docker.internal:5050}
    environment:
      NODE_ENV: production
      PORT: 8080
      HOSTNAME: 0.0.0.0
      API_PROXY_TARGET: ${DOCKER_API_PROXY_TARGET:-http://host.docker.internal:5050}
    ports:
      - "${PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
